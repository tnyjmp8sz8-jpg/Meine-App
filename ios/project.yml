# iPhone-Hülle um die Web-App. Das Xcode-Projekt wird daraus mit XcodeGen erzeugt (auf GitHub, siehe .github/workflows/ios.yml).
# Der Ordner web/ entsteht erst beim Bauen: Er bekommt eine Kopie von index.html, damit es die App nur einmal im Projekt gibt.
name: Track
options:
  bundleIdPrefix: de.trackapp
  deploymentTarget:
    iOS: "16.0"
targets:
  Track:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.trackapp.track
        PRODUCT_NAME: Track
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Track."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
schemes:
  Track:
    build:
      targets:
        Track: all
    run:
      config: Debug
    archive:
      config: Release
