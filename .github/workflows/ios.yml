# Baut die iPhone-Hülle auf einem Mac von GitHub (kostenlos, solange das Repository öffentlich ist):
# unsigniert für das iPhone, als Download unter „Releases“, dazu ein Selbsttest und ein Bild aus dem Simulator.
name: iPhone-App bauen
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: write
# Ein neuer Lauf bricht den vorigen ab: Es soll immer nur der neueste Stand zum Download werden
concurrency:
  group: iphone-bau
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  bauen:
    # Mitte November 2026 starteten die Macs von GitHub zeitweise nicht (Lauf wartet 15 Minuten und wird abgebrochen), mal die einen, mal die anderen.
    # Deshalb wird auf beiden Sorten gebaut: Es reicht, wenn eine durchläuft. Laufen beide, ersetzt der spätere Download den früheren (gleicher Inhalt).
    strategy:
      fail-fast: false
      matrix:
        mac: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.mac }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Web-App in die Hülle legen
        run: |
          mkdir -p ios/web
          cp index.html manifest.webmanifest icon-180.png icon-192.png icon-512.png ios/web/
      - name: Projekt erzeugen
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Für den Simulator bauen
        run: |
          cd ios
          # Für den Simulator signiert Xcode von selbst „zum lokalen Ausführen“; nur so kommen die Freigaben (App-Gruppe für das Widget) in die App
          xcodebuild -project Track.xcodeproj -scheme Track -sdk iphonesimulator -configuration Debug -derivedDataPath build/sim CODE_SIGN_IDENTITY=- build > sim.log 2>&1 || { grep -E "error|BUILD" -B2 -A6 sim.log | head -150; exit 1; }
          tail -3 sim.log
          test -d build/sim/Build/Products/Debug-iphonesimulator/Track.app/PlugIns/TrackWidget.appex
      - name: Für das iPhone bauen (unsigniert)
        run: |
          cd ios
          xcodebuild -project Track.xcodeproj -scheme Track -sdk iphoneos -configuration Release -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > ios.log 2>&1 || { grep -E "error|BUILD" -B2 -A6 ios.log | head -150; exit 1; }
          tail -3 ios.log
          mkdir Payload && cp -R build/ios/Build/Products/Release-iphoneos/Track.app Payload/
          # Freigaben (App-Gruppe, Health) ohne Zertifikat in die App schreiben: AltStore liest sie beim Installieren und richtet die App-Gruppe dafür ein.
          # Erst das Widget, dann die App.
          codesign --force --sign - --entitlements Info/Widget.entitlements Payload/Track.app/PlugIns/TrackWidget.appex
          codesign --force --sign - --entitlements Info/Track.entitlements Payload/Track.app
          codesign -d --entitlements - Payload/Track.app 2>&1 | grep -E "application-groups|healthkit|group\."
          codesign -d --entitlements - Payload/Track.app/PlugIns/TrackWidget.appex 2>&1 | grep -E "application-groups|group\."
          plutil -p Payload/Track.app/Info.plist | grep -E "CFBundleURLSchemes|trackpunkt|NSHealthShare|CFBundleShortVersionString|CFBundleIdentifier|UILaunchScreen"
          plutil -p Payload/Track.app/PlugIns/TrackWidget.appex/Info.plist | grep -E "NSExtensionPointIdentifier|CFBundleIdentifier|CFBundleShortVersionString"
          zip -qr Track.ipa Payload
          ls -la Track.ipa
      - name: Im Simulator prüfen und Bild machen
        timeout-minutes: 14
        run: |
          cd ios
          GERAET=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[5-9]|iPhone [2-9][0-9]" | grep -oE "[0-9A-F-]{36}")
          xcrun simctl list devices available | grep -m3 iPhone
          xcrun simctl boot "$GERAET"
          xcrun simctl bootstatus "$GERAET" -b
          xcrun simctl ui "$GERAET" appearance dark
          xcrun simctl install "$GERAET" build/sim/Build/Products/Debug-iphonesimulator/Track.app
          # Dreimal starten: Der Zähler im Speicher der Web-App muss 1, 2, 3 zeigen, sonst überlebt der Speicher den Neustart nicht.
          # Vor dem Beenden geht die App in den Hintergrund (Einstellungen öffnen), wie auf einem echten iPhone.
          DATEN=$(xcrun simctl get_app_container "$GERAET" de.trackapp.track data)
          for LAUF in 1 2 3; do
            rm -f "$DATEN/Documents/pruefung.json"
            xcrun simctl launch "$GERAET" de.trackapp.track -pruefen
            for I in $(seq 1 30); do [ -f "$DATEN/Documents/pruefung.json" ] && break; sleep 2; done
            echo "PRUEFUNG $LAUF: $(cat "$DATEN/Documents/pruefung.json" 2>/dev/null || echo 'keine Datei')"
            if [ "$LAUF" = 3 ]; then break; fi
            cp "$DATEN/Documents/pruefung.json" "pruefung-$LAUF.json" 2>/dev/null || true
            sleep 4
            xcrun simctl launch "$GERAET" com.apple.Preferences; sleep 4
            xcrun simctl terminate "$GERAET" de.trackapp.track; sleep 2
          done
          cp "$DATEN/Documents/pruefung.json" pruefung-3.json
          # Inhalt des Widgets (dunkel und hell) als Bild, dann die App selbst
          xcrun simctl terminate "$GERAET" de.trackapp.track; sleep 2
          xcrun simctl launch "$GERAET" de.trackapp.track -widgetbild; sleep 6
          xcrun simctl io "$GERAET" screenshot widget.png
          xcrun simctl terminate "$GERAET" de.trackapp.track; sleep 2
          xcrun simctl launch "$GERAET" de.trackapp.track -ohneFragen; sleep 6
          xcrun simctl io "$GERAET" screenshot simulator.png
          # Speicher übersteht Neustarts · Web-App und Hülle sind verbunden · der Stand liegt für das Widget bereit (8 Tage) · Plan der Mitteilungen stimmt
          grep -q '"starts":3' pruefung-3.json
          grep -q '"bruecke":true' pruefung-3.json
          grep -q '"widgetTage":8' pruefung-3.json
          grep -q 'sicherung-0 20.11. 18:00, sicherung-1 23.11. 18:00' pruefung-3.json
          grep -q 'ablauf 20.11. 12:00' pruefung-3.json
      - name: Bild aus dem Simulator ablegen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Das Bild kommt auf einen eigenen Zweig (ios-bild), damit es sich ohne Anmeldung ansehen lässt
          mkdir "$RUNNER_TEMP/bild" && cd "$RUNNER_TEMP/bild" && git init -q
          cp "$GITHUB_WORKSPACE/ios/simulator.png" "$GITHUB_WORKSPACE/ios/widget.png" "$GITHUB_WORKSPACE"/ios/pruefung-*.json . 2>/dev/null || true
          echo "Bau $GITHUB_SHA" > stand.txt
          git add . && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Bild aus dem Simulator"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ios-bild
      - name: Als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ios
          gh release delete iphone-test --yes --cleanup-tag 2>/dev/null || true
          gh release create iphone-test Track.ipa --prerelease --target "$GITHUB_SHA" \
            --title "Track. für das iPhone (Testfassung)" \
            --notes "Unsignierte App-Datei zum Installieren mit AltStore. Sie wird bei jedem Bau ersetzt."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Track-iPhone-${{ matrix.mac }}
          path: |
            ios/Track.ipa
            ios/simulator.png
            ios/widget.png
